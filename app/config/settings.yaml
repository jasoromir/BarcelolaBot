timezone: "Europe/Madrid"
schedule:
  nightly_cron: "30 21 * * 0-4,6"       # Sun-Thu + Sat at 21:30
  nightly_friday_cron: "30 19 * * 5"    # Friday at 19:30 (Shabbat Shalom)
  morning_cron: "30 8 * * *"
broadcast:
  mode: "production"
  test_group_id: "120363425214664727@g.us"  # Barcelola BOT🌻 - for manual test triggers only
  inter_message_delay_ms: 2000
min_bookings_to_run: 1
retry:
  max_attempts: 3
  backoff_ms: [60000, 300000, 900000]
reminders:
  enabled: true
  # Kill-switch for the welcome/confirmation DM + its 24h reminder to new
  # clients, independent of `enabled` above. RE-ENABLED 2026-07-29 after 5
  # stable days (100% connected, zero disconnects) with the send-queue +
  # inter-message-delay safety guards in place. While this is false, welcome +
  # reminder messages are instead forwarded to ליאנה (see forwardToGuidePhone
  # in index.ts / reminders/runner.ts + webhookRoutes.ts) so she can send them
  # manually — flip back to false immediately if WhatsApp restricts the
  # account again (ack=-1 on established contacts, or another logout/ban).
  new_client_messages_enabled: true
  lead_time_hours: 24            # fallback if reminder_send_time not set
  reminder_send_time: "10:00"    # send reminder at 10:00 AM (Europe/Madrid) the day before the tour
  combine_threshold_hours: 24    # if tour starts within 24h of booking, combine confirmation+reminder
  no_reply_alert_minutes_before: 120
  poll_interval_seconds: 30
  official_contact_number: "+34623964800"
  worker_group_id: "120363425214664727@g.us"  # BARCELOLA BOT group
  classifier_confidence_threshold: 0.7
  default_google_maps_url: "https://maps.app.goo.gl/3nbsJJytm6HnDGXL8"
  reply_debounce_seconds: 15
  # Manager DMed on every customer confirm/cancel (text, emoji, or 👍 reaction).
  # Comment out to disable these notifications.
  client_response_notify_phone: "+34623964800"
  # Extra randomized pause between consecutive due reminders fired in the same
  # poll tick, on top of the per-message humanized typing delay — so a batch
  # of several reminders doesn't read as automated bulk sending.
  inter_message_delay_min_ms: 10000
  inter_message_delay_max_ms: 20000
  # Safety net: independently sweeps Wix for today's/tomorrow's confirmed
  # bookings and backfills a reminder row for anyone never queued (e.g. booked
  # while new_client_messages_enabled was off, or a webhook silently failed to
  # queue one) — dedup'd via RemindersStore.get() so an already-queued/sent/
  # replied booking is never touched twice. Keeps running even with client
  # messaging re-enabled, as an ongoing guard against gaps recurring.
  backfill:
    enabled: true
    poll_interval_seconds: 900   # every 15 min — cheap on our side, keeps Wix API usage low
notifications:
  enabled: true
  email_to: "jason.omedes@gmail.com"    # must match the Resend account owner (sandbox sender limitation)
  reactive_after_minutes: 30            # alert once the link has been down this long
  proactive_warn_after_days: 12         # warn to re-link before the ~14d expiry window
  # Chromium-wedge detection. state() reports "connected" while the renderer is
  # stuck and every send times out — this is what silently killed the 2026-08-03
  # nightly broadcast. Probed on the 15-min health tick; 2 strikes = ~30 min.
  browser_probe_timeout_ms: 30000
  browser_probe_failures_before_alert: 2
  # Requires RESEND_API_KEY env var on the host. Defaults to Resend's sandbox
  # sender; set email_from to a verified-domain address for production.
guide_notify:
  enabled: true
  minutes_before: 15            # send the guide their attendee list 15 min before tour start
  poll_interval_seconds: 60     # check every minute for tours entering the send window
  test_mode: false              # when true, send to test_group_id instead of the guide's phone
  test_group_id: "120363425214664727@g.us"  # Barcelola BOT🌻 group (debug target)
  day_before:                   # day-before reminder — now sent to ALL guides
    enabled: true
    send_time: "18:00"          # local (Europe/Madrid) time to send the evening before
    # guide_names omitted → sends to all guides in guides.yaml
  checklist_poll:               # native WhatsApp poll (checklist) sent after the pre-tour roster
    enabled: true
    question: "✅ צ׳ק ליסט לפני הסיור"
    note: "סמנו ✔️ כל משימה בסקר למטה כדי לוודא שלא שכחתם כלום 🙌"
    items:
      - "🕒 להגיע 15 דקות לפני תחילת הסיור"
      - "📋 לסמן נוכחות ב-Wix"
      - "📸 לצלם תמונה קבוצתית בסוף הסיור ולשתף בקבוצה"
    guide_names:                # send the poll ONLY to these guides (omit to send to all)
      - "אדיר"                  # aka רידא — also gets the day-before reminder
moderation:
  enabled: true
  # Enforcement (delete + kick) happens ONLY in these groups. Detection and
  # alerting run everywhere. Delete/kick require the bot to be GROUP ADMIN in
  # each group — without admin the actions fail (and are logged as errors).
  enforce_in_groups:
    - "120363425214664727@g.us"            # Barcelola BOT🌻 - testing group
    - "34651886491-1583845723@g.us"        # 🌻1 מטיילים עם ברצלולה 1🌻
    - "34651886491-1631796027@g.us"        # 🌻2 מטיילים עם ברצלולה 2🌻
    - "34651886491-1612004982@g.us"        # 🌻3 מטיילים עם ברצלולה 3🌻
    - "34651886491-1581073979@g.us"        # 🌻4 מטיילים עם ברצלולה 4🌻
    - "34651886491-1613062135@g.us"        # 🌻5 מטיילים עם ברצלולה 5🌻
  new_joiner_window_minutes: 60
  score_spam_threshold: 0.8       # >= this → auto delete+kick (in enforce groups)
  score_review_min: 0.4           # 0.4–0.8 → ask Gemini to decide
  # Substrings (case-insensitive) that flag crypto / financial / promo spam.
  # Mix of English and Hebrew investment/stock-market terms seen in real spam.
  keywords:
    # English / crypto
    - usdt
    - usdc
    - btc
    - bitcoin
    - binance
    - crypto
    - airdrop
    - "pump"
    - profit
    - invest
    - trading
    - forex
    - "dm me"
    - telegram
    - earn money
    - withdraw
    - wallet
    # Hebrew — stock market / investing pitch
    - שוק המניות      # the stock market
    - מניות           # stocks
    - השקעות          # investments
    - השקעה           # investment
    - משקיעים         # investors
    - שווקי ההון      # capital markets
    - שוק ההון        # capital market
    - מסחר            # trading
    - רווח            # profit
    - תשואה           # returns/yield
    - קריפטו          # crypto
    - ביטקוין         # bitcoin
    - הפרופסור        # "the professor" (recurring spam persona)
    - קבוצת vip       # VIP group
    - קבוצת ה-vip     # the VIP group
  # Never delete/kick these numbers, even if a message scores as spam.
  never_action_phones:
    - "+34623964800"   # official contact
private_tours:
  enabled: true                 # service account is set up and verified against production calendar
  calendar_id: "guidesbarcelola@gmail.com"
  sync:
    enabled: true                # daily fetch+parse batch (only runs if private_tours.enabled is also true)
    cron: "0 18 * * *"           # 18:00 local, daily
    window_days_back: 0
    window_days_forward: 14
  notify:
    enabled: true                # day-before guide+manager notify
    send_time: "18:30"
    poll_interval_seconds: 60
    test_mode: false             # verified against test group; now sends to real guide/manager phones
    test_group_id: "120363425214664727@g.us"  # Barcelola BOT🌻 group (debug target)
    manager_guide_name: "ליאנה"
